<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Todo app</title>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div class="container">

    <header class="header">
      <h1 class="header__title">Todo</h1>
      <button class="header__mode" type="button">
        <img class="header__icon" src="./images/icon-moon.svg" alt="">
      </button>
    </header>

    <main class="main">

      <form class="todo-form">
        <div class="todo-form__check"></div>

        <label class="sr-only" for="todo-form">Create a new todo</label>
        <input class="todo-form__input" name="todo-form" id="todo-form" type="text" placeholder="Create a new todo...">
      </form>

      <div class="todo-card">

        <ul class="todo">

          <li class="todo__item">
            <div class="todo__box">
              <input class="todo__input" type="checkbox" name="todo-item" id="todo-item">
              <label class="todo__label" for="todo-item">Complete online JavaScript course</label>
            </div>
            <button class="todo__delete" type="button"><img src="./images/icon-cross.svg" alt=""></button>
          </li>
          <li class="todo__item">
            <div class="todo__box">
              <input class="todo__input" type="checkbox" name="todo-item" id="todo-item">
              <label class="todo__label" for="todo-item">Complete online JavaScript course</label>
            </div>
            <button class="todo__delete" type="button"><img src="./images/icon-cross.svg" alt=""></button>
          </li>

        </ul>

          <div class="toolbar">

            <div class="toolbar__count">
              <span class="toolbar__number">5</span>
              <span class="toolbar__text">items left</span>
            </div>

            <button class="toolbar__clear-button" type="button">Clear Completed</button>
          </div>

        </div>

        <ul class="toolbar__filters">
          <li>
            <button class="toolbar__filter" type="button">All</button>
          </li>
          <li>
            <button class="toolbar__filter" type="button">Active</button>
          </li>
          <li>
            <button class="toolbar__filter" type="button">Completed</button>
          </li>
        </ul>

      <p class="main__text">Drag and drop to reorder list</p>
    </main>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>

</html>
